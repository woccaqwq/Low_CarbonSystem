<text x="125" y="145" text-anchor="middle" font-size="12" font-weight="bold">登录界面（待实现）</text>
<line x1="335" y1="179" x2="335" y2="1332" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="239" y="123" width="192" height="56" rx="4" fill="#fff3d3" stroke="#315b87" stroke-dasharray="5 3"/>
<text x="335" y="145" text-anchor="middle" font-size="12" font-weight="bold">UserService（待实现）</text>
