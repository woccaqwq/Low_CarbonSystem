<rect width="1720" height="1362" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18314b} .body{font-size:12px} .small{font-size:11px}</style>
<text x="30" y="36" font-size="24" font-weight="bold">登录接入时序</text>
<text x="30" y="65" font-size="13">UserService / GUI 尚未实现；图示推荐接入顺序，DAO 和工具已有实现。</text>
<text x="30" y="91" class="small">蓝色：已有类型/能力　黄色虚线：待实现接入组件　alt / else：互斥路径　同一 conn：同一数据库事务</text>
<rect x="16" y="942" width="1688" height="184" fill="none" stroke="#9aaec3" stroke-width="1.1"/>
<rect x="16" y="448" width="1688" height="808" fill="none" stroke="#9aaec3" stroke-width="1.1"/>
<line x1="125" y1="179" x2="125" y2="1332" stroke="#a8b6c5" stroke-dasharray="6 5"/>
