<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="930" viewBox="0 0 1300 930">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#294a70"/></marker></defs>
<rect width="1300" height="930" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#18314b} .body{font-size:12px} .small{font-size:11px}</style>
<text x="30" y="36" font-size="24" font-weight="bold">违规下架事务接入时序</text>
<text x="30" y="65" font-size="13">AdminService 与界面尚未实现；状态写入和业务日志的同连接能力已有实现。</text>
<text x="30" y="91" class="small">蓝色：已有类型/能力　黄色虚线：待实现接入组件　alt / else：互斥路径　同一 conn：同一数据库事务</text>
<rect x="16" y="402" width="1268" height="294" fill="none" stroke="#9aaec3" stroke-width="1.1"/>
<line x1="125" y1="179" x2="125" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="29" y="123" width="192" height="56" rx="4" fill="#fff3d3" stroke="#315b87" stroke-dasharray="5 3"/>
<text x="125" y="145" text-anchor="middle" font-size="12" font-weight="bold">AdminService（待实现）</text>
<line x1="335" y1="179" x2="335" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="239" y="123" width="192" height="56" rx="4" fill="#e5effb" stroke="#315b87" />
<text x="335" y="145" text-anchor="middle" font-size="12" font-weight="bold">DBUtil / Connection</text>
<line x1="545" y1="179" x2="545" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="449" y="123" width="192" height="56" rx="4" fill="#e5effb" stroke="#315b87" />
<text x="545" y="145" text-anchor="middle" font-size="12" font-weight="bold">UserDao</text>
<line x1="755" y1="179" x2="755" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="659" y="123" width="192" height="56" rx="4" fill="#e5effb" stroke="#315b87" />
<text x="755" y="145" text-anchor="middle" font-size="12" font-weight="bold">ItemDao</text>
<line x1="965" y1="179" x2="965" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="869" y="123" width="192" height="56" rx="4" fill="#e5effb" stroke="#315b87" />
<text x="965" y="145" text-anchor="middle" font-size="12" font-weight="bold">OperationLogDao</text>
<line x1="1175" y1="179" x2="1175" y2="900" stroke="#a8b6c5" stroke-dasharray="6 5"/>
<rect x="1079" y="123" width="192" height="56" rx="4" fill="#e5effb" stroke="#315b87" />
<text x="1175" y="145" text-anchor="middle" font-size="12" font-weight="bold">AppLogger</text>
<text class="body" x="134" y="225">1. getConnection(); setAutoC</text>
<text class="body" x="134" y="243">ommit(false)</text>
<line x1="125" y1="253" x2="335" y2="253" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="289">2. findById(conn, operatorId)</text>
<line x1="125" y1="299" x2="545" y2="299" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="335">3. findById(conn, itemId)</text>
<line x1="125" y1="345" x2="755" y2="345" stroke="#294a70"  marker-end="url(#arrow)"/>
<rect x="27" y="368" width="1246" height="31" fill="#fff8df" stroke="#d7b85f"/>
<text class="body" x="38" y="385">重新校验账号可用/管理员角色、物品状态与下架原因；理由先做必要内容处理，不记录凭据或完整表单。</text>
<rect x="17" y="404" width="1266" height="31" fill="#eef3f8" stroke="#c5d0dc"/>
<text class="body" x="38" y="421">alt  校验和所有写入成功</text>
<text class="body" x="134" y="453">4. updateStatus(conn, itemId, OFF_SHELF)；检查 1 行</text>
<line x1="125" y1="463" x2="755" y2="463" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="499">5. insert(conn, 管理员动作、物品编号及安全原因摘要)</text>
<line x1="125" y1="509" x2="965" y2="509" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="545">6. commit()</text>
<line x1="125" y1="555" x2="335" y2="555" stroke="#294a70"  marker-end="url(#arrow)"/>
<rect x="17" y="578" width="1266" height="31" fill="#eef3f8" stroke="#c5d0dc"/>
<text class="body" x="38" y="595">else  权限/状态拒绝、0 行或 RuntimeException / SQLException</text>
<text class="body" x="134" y="627">7. rollback()；保留回滚失败为</text>
<text class="body" x="134" y="645"> suppressed</text>
<line x1="125" y1="655" x2="335" y2="655" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="711">8. close()</text>
<line x1="125" y1="721" x2="335" y2="721" stroke="#294a70"  marker-end="url(#arrow)"/>
<text class="body" x="134" y="757">9. 按已确定结果记录运行日志（可选接入）</text>
<line x1="125" y1="767" x2="1175" y2="767" stroke="#294a70"  marker-end="url(#arrow)"/>
<rect x="27" y="790" width="1246" height="31" fill="#fff8df" stroke="#d7b85f"/>
<text class="body" x="38" y="807">运行日志 IOException 独立处理，不将已提交业务误报成回滚；已有业务异常不能被日志错误覆盖。</text>
<rect x="27" y="826" width="1246" height="31" fill="#fff8df" stroke="#d7b85f"/>
<text class="body" x="38" y="843">FR-19 所有者查看下架原因仍缺少专门授权查询/对象关联设计，不能以管理员能看 operation_log 替代。</text>
</svg>
